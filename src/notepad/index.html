<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notepad · Human Review</title>
  <link rel="stylesheet" href="/notepad.css">
</head>
<body data-token="__TOKEN__">
  <main class="hud">
    <header class="heading">
      <span class="symbol" aria-hidden="true">✎</span>
      <div class="identity">
        <h1>Notepad</h1>
        <label class="sr-only" for="project-notebooks">Project notebook</label>
        <select id="project-notebooks" class="project-picker" title="Switch project notebook"></select>
      </div>
      <span id="count" class="count" aria-label="Pending notes">0</span>
      <button id="delete-notebook" class="project-delete" type="button" title="Delete project notebook" aria-label="Delete selected project notebook">Delete</button>
      <button id="popout" class="popout" type="button" title="Open compact window" aria-label="Open compact notepad window">↗</button>
    </header>
    <div id="notebook-delete-confirm" class="project-confirm" hidden>
      <p>Delete all notes, incoming issue reports, and handoffs for <strong id="notebook-delete-name"></strong>? This cannot be undone.</p>
      <div class="project-confirm-actions">
        <button id="cancel-delete-notebook" class="status" type="button">Cancel</button>
        <button id="confirm-delete-notebook" class="status delete confirm" type="button">Delete notebook</button>
      </div>
    </div>

    <div class="notebook-views" role="group" aria-label="Project notebook sections">
      <button type="button" class="notebook-view active" data-view="notes" aria-pressed="true">Notes</button>
      <button type="button" class="notebook-view" data-view="inbox" aria-pressed="false">
        Issue Inbox <span id="inbox-count" class="inbox-count">0</span>
      </button>
    </div>

    <form id="capture" class="capture">
      <label class="sr-only" for="note-text">New note</label>
      <textarea id="note-text" maxlength="4000" rows="3" placeholder="Capture a thought or task…" required></textarea>
      <div class="capture-bar">
        <span class="hint">Ctrl / ⌘ + Enter</span>
        <button id="add" type="submit" class="primary">Save note <span aria-hidden="true">↗</span></button>
      </div>
    </form>

    <section class="entries" aria-label="Saved notes">
      <div class="filters" role="group" aria-label="Filter notes">
        <button class="filter active" data-filter="pending" aria-pressed="true" type="button">Pending</button>
        <button class="filter" data-filter="done" aria-pressed="false" type="button">Done</button>
        <button class="filter" data-filter="all" aria-pressed="false" type="button">All</button>
      </div>
      <div class="send-row">
        <span id="selected-count" class="selection-count">Select notes</span>
        <div class="selection-actions">
          <button id="move-notes" class="status" type="button" disabled>Move</button>
          <button id="move-all-notes" class="status" type="button" disabled>Move all</button>
          <button id="send-to-agent" class="primary send-button" type="button" disabled>Send to agent</button>
        </div>
      </div>
      <div id="move-panel" class="move-panel" hidden>
        <label class="sr-only" for="move-destination">Destination project notebook</label>
        <select id="move-destination" class="project-picker">
          <option value="">Choose project</option>
        </select>
        <button id="confirm-move" class="primary" type="button" disabled>Move here</button>
        <button id="cancel-move" class="status" type="button">Cancel</button>
      </div>
      <section id="report-panel" class="report-panel" aria-label="Report tool issue" hidden>
        <form id="report-form">
          <p class="report-heading">Report tool issue</p>
          <p id="report-note-title" class="report-source-title"></p>
          <label for="report-destination">Tool project</label>
          <div id="report-project-picker" class="project-choice">
            <input id="report-destination" class="project-picker report-destination"
              role="combobox" aria-autocomplete="list" aria-expanded="false"
              aria-controls="report-projects" autocomplete="off"
              placeholder="Search project or enter directory path" required>
            <div id="report-projects" class="project-results" role="listbox" hidden></div>
          </div>
          <label for="report-expected">Expected behavior</label>
          <textarea id="report-expected" rows="2" maxlength="4000" required></textarea>
          <label for="report-actual">What actually happened</label>
          <textarea id="report-actual" rows="2" maxlength="4000" required></textarea>
          <label for="report-steps">Steps to reproduce</label>
          <textarea id="report-steps" rows="3" maxlength="4000" required></textarea>
          <div class="report-actions">
            <button id="send-report" class="primary" type="submit">Send bug report</button>
            <button id="cancel-report" class="status" type="button">Cancel</button>
          </div>
        </form>
      </section>
      <ul id="notes" class="notes" tabindex="0" aria-label="Saved notes list"></ul>
      <p id="empty" class="empty" hidden>No notes yet.</p>
    </section>

    <footer>
      <span class="connection" id="message" role="status" aria-live="polite">Ready</span>
    </footer>
  </main>
  <script type="module" src="/notepad.js"></script>
</body>
</html>
